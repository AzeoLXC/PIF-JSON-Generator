[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pif-json-generator"
version = "2.0.0"
description = "Automated Play Integrity Fix (PIF) JSON generator from Android system.prop files"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["android", "play-integrity", "pif", "magisk", "system-prop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.32.0,<3.0.0",
    "PyGithub>=2.3.0,<3.0.0",
]

[project.urls]
Repository = "https://github.com/AzeoLXC/PIF-JSON-Generator"
Issues     = "https://github.com/AzeoLXC/PIF-JSON-Generator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pif_generator"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]