name: CI Checks & Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Lint & Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Run Ruff (Lint & Auto-Format Check)
        run: |
          ruff check --fix . || true
          ruff check .

      - name: Run Standalone Self-Check Suite
        run: python tests/self_check.py

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: src:.
        run: pytest -v
